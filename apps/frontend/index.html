<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10100e" />
  <meta name="description" content="GostMood Creative Lab — marketplace créative pour producteurs, musiciens et passionnés de son." />
  <title>GostMood Creative Lab — Le son, sans limites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { ink: '#10100e', panel: '#191916', line: '#33332e', lime: '#d8ff53', muted: '#92928a' }, fontFamily: { sans: ['DM Sans', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] } } } }</script>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .hero-image {
      inset: 0;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 78%, transparent 100%), linear-gradient(to right, transparent 0%, #000 20%, #000 84%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 78%, transparent 100%), linear-gradient(to right, transparent 0%, #000 20%, #000 84%, transparent 100%);
      mask-composite: intersect;
    }
    .privacy-consent{display:flex;align-items:flex-start;gap:10px;margin:16px 0;color:#aaa99f;font-size:12px;line-height:1.65}
    .privacy-consent input{accent-color:#d8ff53;width:16px;height:16px;flex:0 0 auto;margin:2px 0 0}
    .privacy-consent .text-link{padding:0;border:0;background:none;text-decoration:underline;color:#d8ff53}
    .privacy-dialog{width:min(620px,calc(100% - 28px));max-height:82vh;padding:24px;border:1px solid #45453b;background:#171714;color:#f4f1e8}
    .privacy-dialog::backdrop{background:rgba(0,0,0,.76);backdrop-filter:blur(4px)}
    .privacy-dialog-head,.privacy-dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .privacy-dialog-head h2{font:600 26px 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin:8px 0}
    .privacy-dialog-body{max-height:55vh;overflow:auto;color:#b8b8ae;font-size:13px;line-height:1.7;padding-right:8px}
    .privacy-dialog-body h3{color:#d8ff53;font:500 14px 'Space Grotesk',sans-serif;margin:20px 0 5px}
    .privacy-dialog-actions{justify-content:flex-start;margin-top:18px}
    .signup-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0 12px}
    .signup-step{display:flex;align-items:center;gap:7px;color:#77776f;font-size:11px;padding:10px 7px;border-bottom:1px solid #3a3a33}
    .signup-step b{display:grid;place-items:center;width:23px;height:23px;border:1px solid #4a4a40;border-radius:50%;font:11px 'DM Mono',monospace}
    .signup-step.active,.signup-step.complete{color:#d8ff53;border-color:#d8ff53}
    .signup-step.active b,.signup-step.complete b{background:#d8ff53;color:#10100e;border-color:#d8ff53}
    .signup-progress{font:11px 'DM Mono',monospace;color:#92928a;margin:0 0 18px}
    .signup-panel{min-height:152px}
    .signup-controls{display:flex;justify-content:space-between;gap:10px;margin:10px 0 16px}
    .signup-login-link{font-size:12px}
    .password-field{position:relative}
    .password-field .form-field{padding-right:52px}
    .password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:#d8ff53;font-size:17px}
    .auth-divider{display:flex;align-items:center;gap:12px;color:#77776f;font:10px 'DM Mono',monospace;margin:18px 0}
    .auth-divider:before,.auth-divider:after{content:'';height:1px;flex:1;background:#33332e}
    .google-button{width:100%;margin:4px 0 16px}
    .google-g{font:700 16px Arial,sans-serif;color:#4285f4}
    .remember-consent{display:flex;align-items:center;gap:9px;margin:12px 0 17px;color:#aaa99f;font-size:12px;line-height:1.5}
    .remember-consent input{accent-color:#d8ff53;width:16px;height:16px;flex:0 0 auto;margin:0}
    .cookie-banner{position:fixed;z-index:50;left:20px;right:20px;bottom:18px;margin:auto;width:min(940px,calc(100% - 40px));display:flex;align-items:center;justify-content:space-between;gap:22px;padding:18px 20px;background:#191916;border:1px solid #414138;box-shadow:0 14px 50px #0009}
    .cookie-copy{max-width:560px}.cookie-copy strong{font:600 15px 'Space Grotesk',sans-serif}.cookie-copy p{font-size:11px;line-height:1.6;color:#aaa99f;margin:6px 0}
    .cookie-copy .text-link{font-size:11px;color:#d8ff53;text-decoration:underline;background:none;border:0;padding:0}
    .cookie-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.cookie-actions .btn{white-space:nowrap}
    @media(max-width:650px){.cookie-banner{left:10px;right:10px;bottom:10px;width:calc(100% - 20px);padding:15px;display:block}.cookie-actions{justify-content:stretch;margin-top:12px}.cookie-actions .btn{flex:1;padding:10px 9px;font-size:10px}.signup-step{font-size:9px;gap:4px;padding-inline:3px}.signup-step b{width:20px;height:20px}}
  </style>
</head>
<body class="bg-ink text-white font-sans antialiased">
  <div class="noise" aria-hidden="true"></div>
  <header id="site-header" class="site-header"></header>
  <main id="app" class="min-h-screen"></main>
  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast-root" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="/assets/app.js?v=10"></script>
</body>
</html>
